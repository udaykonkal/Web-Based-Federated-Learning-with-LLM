services:
  - type: web
    name: fl-healthcare-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./fl_healthcare.db
      - key: SYNC_DATABASE_URL
        value: sqlite:///./fl_healthcare.db
      - key: DATA_DIR
        value: ./data
      - key: GEMINI_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
    disk:
      name: fl-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
